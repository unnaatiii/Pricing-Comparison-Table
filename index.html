<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Comparison Table</title>
</head>
<body>
    <header>
        <h1>Acme Plans</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <main>
        <table>
            <caption>Plan Comparison</caption>
            <thead>
                <tr>
                    <td scope="col">Plan</td>
                    <td scope="col">Storage</td>
                    <td scope="col">Projects</td>
                    <td scope="col">Support</td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td scope="row"> Free </td>
                    <td> 5 GB </td>
                    <td> 3 </td>
                    <td> Email</td>
                </tr>
                <tr>
                    <td scope="row"> Pro </td>
                    <td> 100 GB </td>
                    <td> 25 </td>
                    <td> Priority Email</td>
                </tr>
                <tr>
                    <td scope="row"> Business </td>
                    <td> 1 TB </td>
                    <td> Unlimited </td>
                    <td> 24/7 Phone</td>
                </tr>
                <tr>
                    <td colspan="4"> All Plan include SSL and daily backups.</td>
                </tr>
            </tbody>
        </table>
    </main>
    <footer>
        <p>&copy; 2025 Acme Plans</p>
    </footer>
</body>
</html>
